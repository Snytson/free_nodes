name: Refresh source subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: sources-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Discover GitHub subscription sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tests/test_discover_github_sources.py
          python scripts/discover_github_sources.py --query v2ray --limit 300 --cap 300

      - name: Publish sources snapshot
        env:
          CATALOG_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/publish_snapshot.py sources
